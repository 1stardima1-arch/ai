<!--
  Source for the Android native launch screen (scripts/twa/assets/splash/*.png), shown
  while the TWA's WebView is still cold-starting — before the page itself can render the
  in-app animated <AppSplash>. A static frame of that same design, so the two hand off
  without a visual jump.

  To regenerate after a design change here, render this file at 1200x1200 (matching the
  xxxhdpi density) and downscale to the other four densities Bubblewrap expects:

    node -e "
      const { chromium } = require('playwright');
      (async () => {
        const browser = await chromium.launch();
        const page = await browser.newPage({ viewport: { width: 1200, height: 1200 } });
        await page.goto('file://' + require('path').resolve('scripts/twa/splash-source.html'));
        await page.screenshot({ path: '/tmp/splash-master.png' });
        await browser.close();
      })();
    "
    node -e "
      const sharp = require('sharp');
      const sizes = { mdpi: 300, hdpi: 450, xhdpi: 600, xxhdpi: 900, xxxhdpi: 1200 };
      Promise.all(Object.entries(sizes).map(([name, size]) =>
        sharp('/tmp/splash-master.png').resize(size, size).toFile(\`scripts/twa/assets/splash/\${name}.png\`)
      ));
    "

  generate.js copies these onto the generated project's drawable-*/splash.png at build time.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Manrope:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 1200px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 1200px;
    background:
      radial-gradient(50% 40% at 26% 22%, rgba(90,141,255,0.32), transparent 72%),
      radial-gradient(50% 40% at 78% 82%, rgba(176,107,255,0.28), transparent 72%),
      #0b0b14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .dot {
    position: absolute;
    border-radius: 50%;
    background: #fff;
  }

  .orb {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 999px;
    background: conic-gradient(from 40deg, #ff8a5c, #ff5f9e, #b06bff, #5a8dff, #64d8ff, #7dffb2, #ff8a5c);
    box-shadow: 0 0 90px rgba(120, 130, 255, 0.35);
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: 18%;
    border-radius: inherit;
    background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.95), rgba(255,255,255,0.25) 65%, transparent);
    filter: blur(1px);
  }

  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: 92px;
    color: #ffffff;
    margin-top: 46px;
    letter-spacing: 0.5px;
  }

  p {
    margin-top: 18px;
    font-size: 30px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="dot" style="left:14%;top:16%;width:6px;height:6px;opacity:0.7"></div>
    <div class="dot" style="left:82%;top:12%;width:8px;height:8px;opacity:0.5"></div>
    <div class="dot" style="left:20%;top:78%;width:5px;height:5px;opacity:0.6"></div>
    <div class="dot" style="left:78%;top:80%;width:7px;height:7px;opacity:0.55"></div>
    <div class="dot" style="left:10%;top:50%;width:5px;height:5px;opacity:0.4"></div>
    <div class="dot" style="left:88%;top:46%;width:6px;height:6px;opacity:0.5"></div>
    <div class="dot" style="left:50%;top:10%;width:5px;height:5px;opacity:0.4"></div>
    <div class="dot" style="left:46%;top:88%;width:6px;height:6px;opacity:0.45"></div>

    <div class="orb"></div>
    <h1>Балл</h1>
    <p>Подготовка к ЕГЭ и ОГЭ</p>
  </div>
</body>
</html>
